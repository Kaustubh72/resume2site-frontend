server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to backend running on the host (works on macOS/Linux via host.docker.internal).
  location /api/ {
    proxy_pass http://host.docker.internal:8081/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # Optional: serve compressed assets if present
  gzip on;
  gzip_types text/plain application/javascript application/json text/css application/xml;
}
